# ─── AQUAINSURE PROXY RULES (FOR EXISTING APACHE 80 / 443 VHOSTS) ──────────────
# Paste this block inside your existing <VirtualHost *:80> or <VirtualHost *:443>,
# or include it via: Include /etc/apache2/conf-available/aquainsure.conf

ProxyPreserveHost On
ProxyRequests Off
Timeout 300
ProxyTimeout 300

# 150MB upload limit for bill photos, telemetry, and documents
LimitRequestBody 157286400

# Support for Next.js Fast Refresh WebSockets
RewriteEngine On
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/aquainsure/_next/(.*) ws://localhost:8080/aquainsure/_next/$1 [P,L,QSA]

RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/dashboard/_next/(.*) ws://localhost:3000/dashboard/_next/$1 [P,L,QSA]

# Navigation shortcuts
RedirectMatch 301 ^/$ /aquainsure/
RedirectMatch 301 ^/login$ /dashboard/login

# Reverse Proxy Rules to local Docker services
ProxyPass /api http://localhost:5001/api
ProxyPassReverse /api http://localhost:5001/api

ProxyPass /dashboard http://localhost:3000/dashboard
ProxyPassReverse /dashboard http://localhost:3000/dashboard

ProxyPass /aquainsure http://localhost:8080/aquainsure
ProxyPassReverse /aquainsure http://localhost:8080/aquainsure
