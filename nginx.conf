events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 150M;

    upstream farmer_upstream {
        server farmer-app:8080;
    }

    upstream dashboard_upstream {
        server dashboard-app:3000;
    }

    upstream backend_upstream {
        server backend:5001;
    }

    server {
        listen 80;
        server_name localhost;

        # Root redirects to main farmer app
        location = / {
            return 301 /aquainsure/;
        }

        # Farmer Web App
        location /aquainsure {
            proxy_pass http://farmer_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin & Insurer Dashboard
        location /dashboard {
            proxy_pass http://dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend REST API
        location /api {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
