<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyRequests Off

    # Allow up to 150MB uploads for testing bill scans, videos, and media
    LimitRequestBody 157286400

    # WebSockets (for dev hot-reloading)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/aquainsure/_next/(.*) ws://127.0.0.1:8080/aquainsure/_next/$1 [P,L]

    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/dashboard/_next/(.*) ws://127.0.0.1:3000/dashboard/_next/$1 [P,L]

    # Quick Navigation Redirects
    RedirectMatch 301 ^/$ /aquainsure/
    RedirectMatch 301 ^/login$ /dashboard/login

    # Reverse Proxy Routes
    ProxyPass /api http://127.0.0.1:5001/api
    ProxyPassReverse /api http://127.0.0.1:5001/api

    ProxyPass /dashboard http://127.0.0.1:3000/dashboard
    ProxyPassReverse /dashboard http://127.0.0.1:3000/dashboard

    ProxyPass /aquainsure http://127.0.0.1:8080/aquainsure
    ProxyPassReverse /aquainsure http://127.0.0.1:8080/aquainsure
</VirtualHost>
