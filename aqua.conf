<VirtualHost *:80>
    ServerName localhost
    
    ProxyPreserveHost On
    ProxyRequests Off

    # Support for Next.js Fast Refresh (HMR WebSockets in dev mode - Turbopack & Webpack)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/aquainsure/_next/(.*) ws://localhost:8080/aquainsure/_next/$1 [P,L,QSA]

    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/dashboard/_next/(.*) ws://localhost:3000/dashboard/_next/$1 [P,L,QSA]

    # Backend API (Matches both /api and /api/...)
    ProxyPass /api http://localhost:5001/api
    ProxyPassReverse /api http://localhost:5001/api

    # Dashboard (Next.js on port 3000 with basePath: '/dashboard')
    ProxyPass /dashboard http://localhost:3000/dashboard
    ProxyPassReverse /dashboard http://localhost:3000/dashboard

    # Main Frontend (Next.js on port 8080 with basePath: '/aquainsure')
    ProxyPass /aquainsure http://localhost:8080/aquainsure
    ProxyPassReverse /aquainsure http://localhost:8080/aquainsure

    # Automatically redirect root to the main app
    RedirectMatch ^/$ /aquainsure/

    ErrorLog ${APACHE_LOG_DIR}/aqua-error.log
    CustomLog ${APACHE_LOG_DIR}/aqua-access.log combined
</VirtualHost>
