services:
  # ─── 1. SEAWEEDFS (Storage Master, Filer, Volume & S3 Gateway) ───────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: aquainsure-seaweedfs
    restart: unless-stopped
    ports:
      - "${SEAWEED_S3_PORT:-8333}:8333"
      - "${SEAWEED_FILER_PORT:-8888}:8888"
      - "${SEAWEED_MASTER_PORT:-9333}:9333"
      - "${SEAWEED_VOLUME_PORT:-8085}:8085"
    command: >
      server
      -dir=/data
      -s3
      -filer
      -ip=seaweedfs
      -volume.port=8085
      -s3.port=8333
      -volume.max=${SEAWEEDFS_VOLUME_MAX:-100}
    environment:
      - WEED_S3_ENABLED=true
    volumes:
      - seaweedfs_data:/data
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 2. MONGODB DATABASE ─────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: aquainsure-mongodb
    restart: unless-stopped
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-aquainsure}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 3. BACKEND API SERVICE ──────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/AquaInsurebackend
      dockerfile: dockerfile
    container_name: aquainsure-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      mongodb:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/aquainsure}
      - JWT_SECRET=${JWT_SECRET:-aquainsure-super-secret-jwt-key-2024}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - SEAWEEDFS_MASTER_ENDPOINT=http://seaweedfs:9333
      - SEAWEEDFS_FILER_ENDPOINT=http://seaweedfs:8888
      - SEAWEEDFS_S3_ENDPOINT=http://seaweedfs:8333
      - SEAWEEDFS_BUCKET=${SEAWEEDFS_BUCKET:-aquainsure}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:5001}
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 4. FARMER PWA APP ───────────────────────────────────────────────────────
  farmer-app:
    build:
      context: .
      dockerfile: apps/AquaInsure/dockerfile
    container_name: aquainsure-farmer-app
    restart: unless-stopped
    ports:
      - "${FARMER_PORT:-8080}:8080"
    depends_on:
      - backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 5. ADMIN & INSURER DASHBOARD ────────────────────────────────────────────
  dashboard-app:
    build:
      context: .
      dockerfile: apps/Aquainsuredashboard/Dockerfile
    container_name: aquainsure-dashboard-app
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/dashboard}
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 6. UNIFIED INGRESS REVERSE PROXY ────────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: aquainsure-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - farmer-app
      - dashboard-app
      - backend
    networks:
      - aqua-network
    logging:
      driver: "none"

  # ─── 7. MONGO EXPRESS (Web-based Database GUI) ──────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: aquainsure-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-aquainsure}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - aqua-network
    logging:
      driver: "none"

# ─── PERSISTENT VOLUMES ────────────────────────────────────────────────────────
volumes:
  seaweedfs_data:
    driver: local
  mongodb_data:
    driver: local

# ─── INTERNAL NETWORK ──────────────────────────────────────────────────────────
networks:
  aqua-network:
    driver: bridge
